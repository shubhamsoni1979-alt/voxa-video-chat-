version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: voxa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voxa-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - redis
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: voxa-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: always

volumes:
  redis_data:
